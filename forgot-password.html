<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CareerBridge Placement Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">

    <div class="auth-split-layout">
        <div class="auth-brand-side">
            <div>
                <a href="index.html" class="brand-logo" style="color: #fff;">
                    <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
                    <span>Career<span style="color: #38bdf8;">Bridge</span></span>
                </a>
            </div>

            <div class="auth-brand-content">
                <h1>Secure Password Recovery</h1>
                <p>
                    Verify your institutional or organizational email to reset your account credentials safely.
                </p>
            </div>

            <div style="font-size: 0.85rem; color: #64748b;">
                &copy; 2026 CareerBridge Placement Management System
            </div>
        </div>

        <div class="auth-form-side">
            <div class="auth-form-header">
                <h2>Reset Password</h2>
                <p>Enter your registered email and choose a new password.</p>
            </div>

            <form id="forgot-password-form">
                <div class="form-group">
                    <label class="form-label" for="forgot-email">Registered Email Address *</label>
                    <input type="email" id="forgot-email" class="form-control" placeholder="name@campusplacement.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="forgot-new-password">New Password *</label>
                    <input type="password" id="forgot-new-password" class="form-control" placeholder="Min. 6 characters" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; margin-top: 1rem;">
                    Update Password
                </button>
            </form>

            <div style="margin-top: 2rem; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
                Remembered your password? <a href="login.html" style="font-weight: 600;">Back to Sign In</a>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
